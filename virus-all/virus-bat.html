        * {

        /* ========== 动态彩虹背景 ========== */
        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: flex-start; 
            align-items: center;         
            padding-top: 8vh;           
            padding-bottom: 10vh;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;

            display: flex;
            justify-content: center;
            gap: 40px; /* 两个大区之间的间距 */
            width: 95%;
            max-width: 1200px;
            margin-bottom: 50px;

        .section {

            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            width: 100%;
        }

        /* 区域标题 */
        .section-title {
            font-size: 1.8rem;
            color: #ffffff;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
            padding-bottom: 10px;
            border-bottom: 2px solid rgba(255, 255, 255, 0.3);
            width: 100%;
            text-align: center;
            margin-bottom: 10px;
        }

        /* ========== 毛玻璃下载卡片 ========== */
        .glass-card {
            width: 100%;            
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 25px 30px;     
            border-radius: 20px;    
            
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            text-align: center;
            
            transition: transform 0.3s ease, box-shadow 0.3s ease, background 0.3s ease;
        }

        .glass-card:hover {
            transform: translateY(-5px) scale(1.02);
            box-shadow: 0 15px 45px 0 rgba(255, 255, 255, 0.4);
            background: rgba(255, 255, 255, 0.25); 
        }

        /* 卡片内部文字 */
        .card-title {
            font-size: 1.4rem;
            font-weight: 800;
            color: #ffffff;
            margin-bottom: 10px;
            text-shadow: 0 2px 5px rgba(0,0,0,0.3);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .card-desc {
            font-size: 0.95rem;
            color: rgba(255, 255, 255, 0.85);
            line-height: 1.4;
            margin-bottom: 20px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            height: 2.8em;
        }

        /* 下载按钮基础样式 */

            padding: 10px 25px;
            border-radius: 30px;
            background: rgba(255, 255, 255, 0.9);
            color: #333;
            font-weight: bold;
            font-size: 1rem;
            text-decoration: none;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            white-space: nowrap;
        }

        .download-btn:hover {
            background: #ffffff;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.8); 
            transform: scale(1.05);
        }

        /* 有害区按钮：悬浮变红 */

        }

            color: #2e7d32;
        }

        /* ========== 响应式适配 ========== */
        /* 手机端：两个大区变成上下排列 */
        @media (max-width: 900px) {
            .main-wrapper {
                flex-direction: column;
                align-items: center;
                gap: 50px;
            }
            .section {
                width: 100%;
                max-width: 500px;
            }
        }
        @media (max-width: 768px) {
            .page-title { font-size: 2rem; margin-bottom: 30px; }
            .section-title { font-size: 1.5rem; }
        }
    </style>
